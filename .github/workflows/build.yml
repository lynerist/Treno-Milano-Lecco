name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test e build APK debug
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E -A8 "^e: |What went wrong|error:|FAILED|AssertionError" build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: TrenoLecco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Treno Lecco - ultima build" \
            --notes "APK debug generato automaticamente dall'ultimo push."
