name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E -A8 "^e: |What went wrong|error:" build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: TrenoLecco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
